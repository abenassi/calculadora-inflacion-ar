name: Actualizar snapshot de datos

# Una vez por día. El INDEC publica el IPC con semanas de retraso, así que no hace
# falta más frecuencia: lo que importa es no perderse el día que sale.
on:
  schedule:
    # Fuera del minuto 0: es cuando GitHub tiene más carga y puede descartar corridas.
    - cron: "17 12 * * *" # 09:17 ART
  workflow_dispatch:
  # Correr también cuando cambia el propio pipeline, para no descubrir que lo
  # rompimos recién al día siguiente a las 9 de la mañana.
  push:
    branches: [main]
    paths:
      - ".github/workflows/snapshot.yml"
      - "scripts/**"
      - "src/engine/**"
      # Los tests corren contra el snapshot recién bajado y pueden frenarlo: el push que
      # arregla un test tiene que volver a intentar, no esperar a la corrida del día siguiente.
      - "tests/**"

permissions:
  contents: write
  # Para disparar "Publicar el sitio" a mano después de commitear (ver el último paso).
  actions: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Bajar series de Argentina Data MCP
        env:
          ARGENTINA_DATA_API_KEY: ${{ secrets.ARGENTINA_DATA_API_KEY }}
        run: npm run snapshot

      # Los tests corren contra el snapshot recién bajado. Si el INDEC revisó la
      # serie hacia atrás o cambió de base, esto lo caza antes de publicar.
      - name: Verificar el snapshot nuevo
        run: npm test

      # El push de abajo lo hace el GITHUB_TOKEN, y GitHub no dispara otros workflows por
      # pushes de ese token: "Publicar el sitio" nunca se enteraba de los datos nuevos (ver
      # 0001). El workflow_dispatch es la excepción que sí se puede disparar con ese token.
      # Si falla sólo el dispatch, los datos ya están en main y los publica el deploy de la
      # noche (schedule de deploy.yml). "Re-run" no sirve: vuelve al checkout de antes.
      - name: Commitear si cambió y publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain public/data)" ]; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "chore(datos): snapshot al $(date -u +%Y-%m-%d)"
          git push
          gh workflow run deploy.yml --ref main

      # Si el MCP deja de traer el IPC, todo lo de arriba sigue en verde ("Sin cambios") y
      # el sitio queda viejo sin que nadie se entere. Va último para no frenar el resto.
      - name: Avisar si el IPC nacional quedó atrasado
        run: npx tsx scripts/verificar-frescura.ts

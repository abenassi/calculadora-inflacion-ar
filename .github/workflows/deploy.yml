name: Publicar el sitio

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Red de seguridad: publica todas las noches aunque nadie haya pusheado. El snapshot ya
  # dispara este workflow cuando commitea datos, pero si ese disparo falla, o si algún
  # cambio futuro corta la cadena, el sitio no puede quedar días atrás de main sin que
  # nadie se entere. Ver docs/decisiones/0001.
  schedule:
    # Fuera del minuto 0: es cuando GitHub tiene más carga y puede descartar corridas.
    - cron: "23 3 * * *" # 00:23 ART

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy a la vez, y no cancelamos el que está en curso: dejar el sitio a medio
# publicar es peor que esperar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # El sitio no se publica si el motor está roto: el snapshot commiteado es
      # parte de lo que se testea.
      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
